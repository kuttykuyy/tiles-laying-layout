<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiles Layout Planner</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 1000px;
            width: 100%;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 4px;
        }
        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 13px;
            margin-bottom: 20px;
        }
        .section-label {
            font-weight: 700;
            color: #1e293b;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin: 18px 0 8px;
            border-left: 4px solid #2563eb;
            padding-left: 8px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 10px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
        }
        label {
            font-weight: 600;
            margin-bottom: 5px;
            color: #34495e;
            font-size: 14px;
        }
        label small {
            font-weight: 400;
            color: #94a3b8;
        }
        input, select {
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
        }
        button {
            background-color: #1e293b;
            color: white;
            padding: 12px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            transition: background 0.15s, border-color 0.15s, color 0.15s;
        }
        button:hover {
            background-color: #0f172a;
        }
        button:focus-visible {
            outline: 2px solid #2563eb;
            outline-offset: 2px;
        }
        .actions {
            margin-top: 20px;
            padding-top: 18px;
            border-top: 1px solid #e2e8f0;
        }
        .actions .btn-primary {
            width: 100%;
            margin-top: 0;
            background: #1d4ed8;
        }
        .actions .btn-primary:hover { background: #1e40af; }
        .actions-secondary {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .btn-ghost {
            background: #fff;
            color: #475569;
            border: 1px solid #cbd5e1;
            font-size: 13px;
            padding: 10px 12px;
        }
        .btn-ghost:hover {
            background: #f8fafc;
            border-color: #94a3b8;
            color: #1e293b;
        }

        /* Room editor rows. min-width:0 on the children is essential - grid
           items default to min-content, and a form input's min-content is wide
           enough to blow the track out past the viewport on a phone. */
        .room-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 84px 84px;
            gap: 8px;
            align-items: center;
            padding: 8px;
            margin-bottom: 6px;
            border-radius: 8px;
        }
        /* The extra tracks exist only when view/remove are rendered, which is
           only when there is more than one room. */
        .room-row.has-actions {
            grid-template-columns: minmax(0, 1fr) 84px 84px auto auto;
        }
        .room-row > * { min-width: 0; }
        .room-row input { width: 100%; }
        .room-head {
            padding: 0 8px 2px;
            margin-bottom: 2px;
            font-size: 11px;
            font-weight: 700;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .table-wrap {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        .table-wrap table { min-width: 100%; }

        @media (max-width: 640px) {
            body { padding: 10px; }
            .container { padding: 16px; }
            /* Name gets its own line; size + actions share the next. */
            .room-row {
                grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            }
            .room-row.has-actions {
                grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto auto;
            }
            .room-row .room-name { grid-column: 1 / -1; }
            .room-head { display: none; }
            .form-grid { grid-template-columns: 1fr; }
        }
        .actions-secondary .btn-ghost {
            flex: 1 1 0;
            min-width: 150px;
            width: auto;
            margin-top: 0;
        }
        .unit-toggle button {
            width: auto;
            margin: 0;
            padding: 6px 12px;
            font-size: 12px;
            background: transparent;
            color: #475569;
        }
        .unit-toggle button.active {
            background: #7c3aed;
            color: #fff;
        }
        .unit-toggle button:hover {
            background-color: #7c3aed;
            color: #fff;
        }
        .unit-toggle button.active:hover {
            background-color: #7c3aed;
        }
        .mode-tabs {
            display: flex;
            gap: 6px;
            background: #e2e8f0;
            padding: 6px;
            border-radius: 10px;
            margin-top: 6px;
        }
        .mode-tabs button {
            flex: 1;
            margin: 0;
            padding: 12px;
            font-size: 15px;
            font-weight: 700;
            background: transparent;
            color: #475569;
            border-radius: 7px;
        }
        .mode-tabs button.active {
            background: #2563eb;
            color: #fff;
            box-shadow: 0 2px 6px rgba(37,99,235,0.3);
        }
        .mode-tabs button:hover {
            background: #cbd5e1;
            color: #1e293b;
        }
        .mode-tabs button.active:hover {
            background: #1d4ed8;
            color: #fff;
        }
        .container {
            position: relative;
        }
        .error-box {
            display: none;
            background: #fef2f2;
            border: 1px solid #fca5a5;
            color: #991b1b;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 14px;
            font-weight: 600;
        }
        .results-section {
            margin-top: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .order-summary {
            width: 100%;
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 10px;
            padding: 16px 20px;
            margin-bottom: 15px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
        }
        .order-item .label {
            font-size: 12px;
            color: #1e40af;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }
        .order-item .value {
            font-size: 20px;
            font-weight: 700;
            color: #1e293b;
        }
        .order-item .value.highlight {
            color: #2563eb;
        }
        .stats {
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            background: #e2e8f0;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
            font-weight: 500;
            gap: 8px;
        }
        canvas {
            background-color: #fff;
            max-width: 100%;
            height: auto;
        }
        .legend {
            margin-top: 15px;
            display: flex;
            gap: 20px;
            font-size: 13px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .color-box {
            width: 16px;
            height: 16px;
            border-radius: 3px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📐 <span id="t_title">Tiles Layout Planner</span></h1>
    <div class="subtitle" id="t_subtitle"></div>

    <div class="mode-tabs">
        <button id="modeFloorBtn" onclick="setMode('floor')" class="active"></button>
        <button id="modeWallBtn" onclick="setMode('wall')"></button>
    </div>
    <div style="font-size:12px; color:#64748b; margin:8px 0 14px; text-align:center;" id="t_modeNote"></div>

    <div class="section-label" id="t_sec1"></div>
    <div class="form-grid">
        <div class="input-group">
            <label id="t_tilePreset"></label>
            <select id="tilePreset" onchange="applyTilePreset()"></select>
        </div>
    </div>

    <!-- Hidden mirrors of the currently-selected room, kept in sync by
         syncActiveRoomInputs() so all downstream calculations stay unchanged. -->
    <input type="hidden" id="roomL" value="10">
    <input type="hidden" id="roomW" value="10">

    <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-top:16px;">
        <div class="section-label" id="t_roomsTitle" style="margin:0;"></div>
        <div style="display:flex; align-items:center; gap:6px;">
            <label id="t_inputUnit" style="margin:0; font-size:12px; color:#64748b;"></label>
            <select id="inputUnit" onchange="setInputUnit(this.value)" style="padding:6px 8px; font-size:13px;">
                <option value="ft">ft (decimal)</option>
                <option value="ftin">ft-in (10'6")</option>
                <option value="in">inch</option>
                <option value="m">meter</option>
                <option value="mm" selected>mm</option>
            </select>
        </div>
    </div>
    <div style="font-size:12px; color:#64748b; margin-bottom:10px;" id="t_roomsNote"></div>
    <div id="roomsEditor"></div>
    <button type="button" onclick="addRoom()" id="t_addRoomBtn" class="btn-ghost" style="width:auto; margin-top:10px; padding:9px 16px; font-size:13px;"></button>

    <details id="advancedSection" style="margin-top:14px; border:1px solid #cbd5e1; border-radius:8px; padding:10px 14px; background:#f8fafc;">
        <summary style="cursor:pointer; font-weight:700; color:#334155; font-size:14px;" id="t_advancedSummary"></summary>
        <div class="form-grid" style="margin-top:12px;">
            <div class="input-group">
                <label id="t_tileL"></label>
                <input type="number" id="tileL" value="600" step="1" min="1">
            </div>
            <div class="input-group">
                <label id="t_tileW"></label>
                <input type="number" id="tileW" value="600" step="1" min="1">
            </div>
            <div class="input-group">
                <label id="t_piecesPerBox"></label>
                <input type="number" id="piecesPerBox" value="2" step="1" min="1">
            </div>
            <div class="input-group">
                <label id="t_boxCoverageAuto"></label>
                <input type="text" id="boxCoverageDisplay" value="—" disabled style="background:#e2e8f0; color:#334155; font-weight:600;">
            </div>
            <div class="input-group">
                <label id="t_spacer"></label>
                <input type="number" id="spacer" value="3" step="0.5" min="0">
            </div>
            <div class="input-group">
                <label id="t_layoutType"></label>
                <select id="layoutType">
                    <option value="center" id="t_opt_center"></option>
                    <option value="tl" id="t_opt_tl"></option>
                    <option value="tr" id="t_opt_tr"></option>
                    <option value="bl" id="t_opt_bl"></option>
                    <option value="br" id="t_opt_br"></option>
                </select>
            </div>
            <div class="input-group">
                <label id="t_handling"></label>
                <input type="number" id="handling" value="5" step="1" min="0" max="30">
            </div>
            <div class="input-group">
                <label id="t_autoWasteLabel"></label>
                <input type="text" id="autoWasteDisplay" value="—" disabled style="background:#e2e8f0; color:#334155; font-weight:600;">
            </div>
            <div class="input-group">
                <label id="t_ratePerBox"></label>
                <input type="number" id="ratePerBox" value="0" step="10" min="0">
            </div>
            <div class="input-group">
                <label id="t_tileImage"></label>
                <div style="display:flex; gap:6px; align-items:center;">
                    <input type="file" id="tileImageInput" accept="image/*" multiple onchange="handleTileImage(event)" style="flex:1; min-width:0;">
                    <button type="button" onclick="clearTileImage()" id="t_clearImageBtn" title="Remove photo" class="btn-ghost" style="width:auto; margin:0; padding:10px 12px; flex-shrink:0;">✕</button>
                </div>
            </div>
            <div class="input-group">
                <label id="t_skirting"></label>
                <select id="skirtingOn" onchange="calculateAndDraw()">
                    <option value="no">No skirting</option>
                    <option value="yes">Include skirting</option>
                </select>
            </div>
            <div class="input-group">
                <label id="t_skirtHeight"></label>
                <input type="number" id="skirtHeight" value="100" step="5" min="25" max="300">
            </div>
            <div class="input-group">
                <label id="t_doorWidth"></label>
                <input type="number" id="doorWidth" value="0" step="10" min="0">
            </div>
        </div>
    </details>

    <details id="openingsSection" style="margin-top:10px; border:1px solid #cbd5e1; border-radius:8px; padding:10px 14px; background:#f8fafc;">
        <summary style="cursor:pointer; font-weight:700; color:#334155; font-size:14px;" id="t_sec4"></summary>
        <div style="font-size:12px; color:#64748b; margin:10px 0;" id="t_openingNote"></div>
        <div class="form-grid" style="align-items:end;">
            <div class="input-group">
                <label id="t_openName"></label>
                <input type="text" id="openName" placeholder="Window / Door / Switchboard">
            </div>
            <div class="input-group">
                <label id="t_openW"></label>
                <input type="number" id="openW" step="0.1" min="0.1" value="4">
            </div>
            <div class="input-group">
                <label id="t_openH"></label>
                <input type="number" id="openH" step="0.1" min="0.1" value="3">
            </div>
            <div class="input-group">
                <label id="t_openX"></label>
                <input type="number" id="openX" step="0.1" min="0" value="2">
            </div>
            <div class="input-group">
                <label id="t_openY"></label>
                <input type="number" id="openY" step="0.1" min="0" value="3">
            </div>
            <div class="input-group">
                <button type="button" onclick="addOpening()" id="t_addOpenBtn" class="btn-ghost" style="width:auto; padding:9px 16px; font-size:13px;"></button>
            </div>
        </div>
        <div id="openingsListSection" style="display:none; margin-top:10px; flex-wrap:wrap; gap:8px;"></div>
    </details>

    <div class="actions">
        <button onclick="calculateAndDraw()" id="t_renderBtn" class="btn-primary"></button>
        <div class="actions-secondary">
            <button onclick="compareLayouts()" id="t_compareBtn" class="btn-ghost"></button>
            <button onclick="compareWastage()" id="t_wasteCompareBtn" class="btn-ghost"></button>
            <button onclick="downloadReport()" id="t_reportBtn" class="btn-ghost"></button>
        </div>
    </div>
    <div class="error-box" id="errorBox"></div>

    <div class="results-section">
        <div id="wasteCompareSection" style="display:none; width:100%; margin-bottom:20px;">
            <div class="section-label" id="t_wasteCompareTitle"></div>
            <div class="table-wrap"><table id="wasteCompareTable" style="width:100%; border-collapse:collapse; font-size:14px;"></table></div>
            <div style="margin-top:8px; font-size:12px; color:#64748b;" id="t_wasteCompareNote"></div>
        </div>
        <div id="manualCompareSection" style="width:100%; margin-bottom:20px;">
            <div class="section-label" id="t_manualCompareTitle"></div>
            <div class="table-wrap"><table id="manualCompareTable" style="width:100%; border-collapse:collapse; font-size:14px;"></table></div>
            <div style="margin-top:8px; font-size:12px; color:#64748b;" id="t_manualCompareNote"></div>

            <div style="display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:14px;">
                <div style="text-align:center; border:2px solid #fca5a5; border-radius:8px; padding:8px; background:#fef2f2;">
                    <div style="font-size:12px; font-weight:700; color:#991b1b; margin-bottom:6px;" id="t_naiveGridCaption"></div>
                    <canvas id="naiveCanvas" style="border:2px solid #1e293b; max-width:100%; height:auto; background:#fff;"></canvas>
                    <div style="font-size:11px; color:#64748b; margin-top:6px;" id="t_naiveGridSub"></div>
                </div>
                <div style="text-align:center; border:2px solid #93c5fd; border-radius:8px; padding:8px; background:#eff6ff;">
                    <div style="font-size:12px; font-weight:700; color:#1e40af; margin-bottom:6px;" id="t_appGridCaption"></div>
                    <canvas id="appMiniCanvas" style="border:2px solid #1e293b; max-width:100%; height:auto; background:#fff;"></canvas>
                    <div style="font-size:11px; color:#64748b; margin-top:6px;" id="t_appGridSub"></div>
                </div>
            </div>
        </div>

        <div id="compareSection" style="display:none; width:100%; margin-bottom:20px;">
            <div class="section-label" id="t_compareTitle"></div>
            <div class="table-wrap"><table id="compareTable" style="width:100%; border-collapse:collapse; font-size:14px; margin-bottom:16px;"></table></div>
            <div id="compareGrids" style="display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:14px;"></div>
        </div>

        <div id="skirtingSection" style="display:none; width:100%; margin-bottom:20px;">
            <div class="section-label" id="t_skirtTitle"></div>
            <div class="table-wrap"><table id="skirtingTable" style="width:100%; border-collapse:collapse; font-size:14px;"></table></div>
            <div style="margin-top:8px; font-size:12px; color:#64748b;" id="t_skirtNote"></div>
        </div>

        <div id="combinedRoomsSection" style="display:none; width:100%; margin-bottom:20px;">
            <div class="section-label" id="t_combinedTitle"></div>
            <div id="roomsGallery" style="display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:14px; margin-bottom:16px;"></div>
            <div class="table-wrap"><table id="combinedRoomsTable" style="width:100%; border-collapse:collapse; font-size:14px;"></table></div>
        </div>

        <div class="order-summary" id="orderSummary"></div>

        <div class="stats" id="statsBox"></div>

        <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:center; margin-bottom:10px;">
            <div class="unit-toggle" style="display:flex; gap:4px; background:#e2e8f0; padding:4px; border-radius:8px; margin:0;">
                <button id="unitFtBtn" onclick="setUnit('ft')">ft</button>
                <button id="unitFtInBtn" onclick="setUnit('ftin')">ft-in</button>
                <button id="unitMmBtn" onclick="setUnit('mm')" class="active">mm</button>
            </div>
            <button type="button" onclick="swapTileOrientation()" id="t_orientBtn" class="btn-ghost" style="width:auto; margin:0; padding:9px 14px; font-size:13px;"></button>
        </div>

        <canvas id="layoutCanvas" width="600" height="600"></canvas>

        <div class="legend">
            <div class="legend-item">
                <div class="color-box" style="background-color: #93c5fd; border: 1px solid #2563eb;"></div>
                <span id="t_legendFull"></span>
            </div>
            <div class="legend-item">
                <div class="color-box" style="background-color: #fca5a5; border: 1px solid #ef4444;"></div>
                <span id="t_legendCut"></span>
            </div>
        </div>
        <div style="margin-top:8px; font-size:12px; color:#64748b; text-align:center;" id="t_labelNote"></div>
        <div id="patternLegend" style="display:none; margin-top:10px; flex-wrap:wrap; gap:10px; justify-content:center;"></div>
    </div>
</div>

<script>
const I18N = {
    en: {
        title: 'Tiles Layout Planner',
        subtitle: 'Room size → Layout → Boxes to order',
        sec1: '🎨 Room Size & Tile Choice',
        tilePreset: 'Tile Size (standard sizes)',
        modeFloor: '🟦 Floor Tiles',
        modeWall: '🧱 Wall Tiles',
        modeNoteFloor: 'Floor tiling — room length × width (plan view).',
        modeNoteWall: 'Wall tiling — wall width × height (elevation view). Wall and floor are separate SKUs, so their box counts are kept separate.',
        inputUnitLabel: 'Input unit:',
        roomsTitleFloor: '🏠 Rooms',
        roomsTitleWall: '🧱 Walls',
        dimLenFloor: 'Length',
        dimWidFloor: 'Width',
        dimLenWall: 'Wall Width',
        dimWidWall: 'Wall Height',
        roomsTitle: '🏠 Rooms',
        roomsNote: 'Edit each room\'s name and size directly. Press 👁 to choose which room shows the detailed layout below.',
        viewBtn: 'View',
        viewing: 'Viewing',
        advancedSummary: '⚙️ Advanced settings (spacer, layout, rate, photo) — only if you need them',
        roomL: 'Primary Room Length',
        roomW: 'Primary Room Width',
        tileL: 'Tile Length',
        tileW: 'Tile Width',
        spacer: 'Grout Spacer Gap (mm)',
        layoutType: 'Layout Alignment',
        opt_center: 'Center-Balanced',
        opt_tl: 'Corner Start - Top-Left',
        opt_tr: 'Corner Start - Top-Right',
        opt_bl: 'Corner Start - Bottom-Left',
        opt_br: 'Corner Start - Bottom-Right',
        tileImage: 'Upload Tile Pattern Photos (multiple allowed)',
        patternLegendLabel: 'Patterns in use (never repeats on adjacent tiles)',
        clearImageBtn: '✕ Remove Photo',
        sec2: 'Order Calculation',
        sec3: 'Multiple Rooms (Optional)',
        multiRoomNote: 'The primary room above is already included in the combined order. Add only the EXTRA rooms here (Bedroom, Kitchen, etc.) — they share the same tile size/spacer set above.',
        sec4: '🚪 Openings — Window / Door / Fixture (Wall Tiling)',
        openingNote: 'For wall tiling. Tiles aren\'t needed where a window or door sits — that area is removed from the count. Measure position from the BOTTOM-LEFT corner of the wall.',
        openName: 'Opening Name',
        openW: 'Width',
        openH: 'Height',
        openX: 'From Left',
        openY: 'From Bottom',
        addOpenBtn: '+ Add Opening',
        openingsSaved: 'tiles saved by openings',
        openingArea: 'Opening Area',
        roomName: 'Room Name',
        roomAddL: 'Length',
        roomAddW: 'Width',
        addRoomBtn: '+ Add Room',
        col_roomName: 'Room',
        col_size: 'Size',
        removeRoom: 'Remove',
        combinedTitle: '🏠 Combined Order — All Rooms',
        row_combinedTotal: 'Combined Order (all rooms pooled)',
        row_separateTotal: 'If Ordered Separately',
        boxesSaved: 'boxes saved by pooling into one order',
        reportBtn: '📄 Download Report',
        reportTitle: 'Tile Order Report',
        reportDate: 'Date',
        reportTileSpec: 'Tile Specification',
        reportRoomBreakdown: 'Room-wise Breakdown',
        reportGrandTotal: 'Grand Total Order',
        reportCompareTitle: 'Layout Comparison — All Alignments & Tile Directions',

// Pure grid simulation, reusable for both single-render and multi-layout comparison.
// Naive "napkin math" grid: places ONLY complete full tiles, top-left start,
// and stops wherever a cut would be needed. This deliberately leaves visible
// uncovered strips at the far edges - the physical consequence of a method
// that never accounts for cut pieces at all.
function simulateNaiveGrid(roomL, roomW, tileL, tileW, spacerFt) {
    const stepX = tileL + spacerFt;
    const stepY = tileW + spacerFt;
    const cols = Math.floor((roomL + spacerFt) / stepX);
    const rowsCount = Math.floor((roomW + spacerFt) / stepY);
    const cells = [];
    for (let c = 0; c < cols; c++) {
        for (let r = 0; r < rowsCount; r++) {
            cells.push({
                drawX: c * stepX,
                drawY: r * stepY,
                drawW: tileL,
                drawH: tileW,
                isCut: false,
                colIdx: c,
                rowIdx: r
            });
        }
    }
    return { cells, coveredPieces: cols * rowsCount };
}

let openings = []; // { id, name, w, h, x, y } - x/y measured from BOTTOM-LEFT of the wall
let openingIdCounter = 1;

// Converts a stored opening (bottom-left origin, as a mason measures) into
// canvas-space rect (top-left origin, as the grid is drawn).
function openingToCanvasRect(op, roomW) {
    return {
        x1: op.x,
        y1: roomW - (op.y + op.h), // flip vertical axis
        x2: op.x + op.w,
        y2: roomW - op.y
    };
}

// Returns 'full' if the cell lies entirely inside an opening (no tile needed),
// 'partial' if it is clipped by one (still consumes a whole source tile as a cut),
// or 'none' if untouched.
function cellOpeningState(cellX, cellY, cellW, cellH, rects) {
    const cx2 = cellX + cellW, cy2 = cellY + cellH;
    let partial = false;
    for (const r of rects) {
        const overlapW = Math.min(cx2, r.x2) - Math.max(cellX, r.x1);
        const overlapH = Math.min(cy2, r.y2) - Math.max(cellY, r.y1);
        if (overlapW > 0.01 && overlapH > 0.01) {
            // fully swallowed by this opening?
            if (cellX >= r.x1 - 0.01 && cy2 <= r.y2 + 0.01 &&
                cx2 <= r.x2 + 0.01 && cellY >= r.y1 - 0.01) {
                return 'full';
            }
            partial = true;
        }
    }
    return partial ? 'partial' : 'none';
}

function simulateGrid(layoutType, roomL, roomW, tileL, tileW, spacerFt, openingRects) {
    const stepX = tileL + spacerFt;
    const stepY = tileW + spacerFt;
    let startX = 0;
    let startY = 0;

    if (layoutType === 'center') {
        const remainderX = roomL % stepX;
        const remainderY = roomW % stepY;
        startX = remainderX > 0.01 ? -((stepX - remainderX) / 2) : 0;
        startY = remainderY > 0.01 ? -((stepY - remainderY) / 2) : 0;
    } else if (layoutType === 'tr') {
        const remainderX = roomL % stepX;
        startX = remainderX > 0.01 ? -(stepX - remainderX) : 0;
    } else if (layoutType === 'bl') {
        const remainderY = roomW % stepY;
        startY = remainderY > 0.01 ? -(stepY - remainderY) : 0;
    } else if (layoutType === 'br') {
        const remainderX = roomL % stepX;
        const remainderY = roomW % stepY;
        startX = remainderX > 0.01 ? -(stepX - remainderX) : 0;
        startY = remainderY > 0.01 ? -(stepY - remainderY) : 0;
    }

    let fullTiles = 0;
    let cutTiles = 0;
    const cells = [];
    let colIdx = 0;

    for (let x = startX; x < roomL; x += stepX) {
        let rowIdx = 0;
        for (let y = startY; y < roomW; y += stepY) {
            const drawX = Math.max(0, x);
            const drawY = Math.max(0, y);
            const drawW = Math.min(tileL, roomL - drawX, (x + tileL) - drawX);
            const drawH = Math.min(tileW, roomW - drawY, (y + tileW) - drawY);

            if (drawW > 0.01 && drawH > 0.01) {
                const rects = openingRects || [];
                const opState = rects.length
                    ? cellOpeningState(drawX, drawY, drawW, drawH, rects)
                    : 'none';

                if (opState === 'full') {
                    // Entirely behind a window/door - no tile is laid here at all.
                    rowIdx++;
                    continue;
                }

                // A tile clipped by an opening still has to be cut on site,
                // so it counts as a cut piece and consumes a whole source tile.
                const isCut = opState === 'partial' ||
                    (drawW < tileL - 0.05) || (drawH < tileW - 0.05);
                if (isCut) cutTiles++; else fullTiles++;
                cells.push({ drawX, drawY, drawW, drawH, isCut, colIdx, rowIdx });
            }
            rowIdx++;
        }
        colIdx++;
    }
    return { fullTiles, cutTiles, cells };
}

// Pure order-quantity math, reusable for both single-render and comparison.
// Shared math core - takes raw piece/area totals directly so it can be reused
// for a single room OR a pooled total across multiple rooms.
function computeOrderCore(piecesToBuy, tileAreaEach, totalSqFt, piecesPerBox, handlingPct, ratePerBox) {
    const rawAreaNeeded = piecesToBuy * tileAreaEach;
    const geometricWastePct = totalSqFt > 0 ? ((rawAreaNeeded - totalSqFt) / totalSqFt) * 100 : 0;
    const piecesWithBuffer = Math.ceil(piecesToBuy * (1 + handlingPct / 100));
    const boxesNeeded = Math.ceil(piecesWithBuffer / piecesPerBox);
    const totalPiecesShipped = boxesNeeded * piecesPerBox;
    const areaWithBuffer = totalPiecesShipped * tileAreaEach;
    const boxCoverageSqFt = piecesPerBox * tileAreaEach;
    const estimatedCost = boxesNeeded * ratePerBox;
    return {
        piecesToBuy, tileAreaEach, totalSqFt, geometricWastePct,
        piecesWithBuffer, boxesNeeded, totalPiecesShipped, areaWithBuffer,
        boxCoverageSqFt, estimatedCost
    };
}

function computeOrder(fullTiles, cutTiles, tileL, tileW, roomL, roomW, piecesPerBox, handlingPct, ratePerBox, netAreaOverride) {
    const piecesToBuy = fullTiles + cutTiles;
    const tileAreaEach = tileL * tileW;
    // When openings are present, the area actually needing tile is smaller than
    // the raw wall rectangle - otherwise wastage % would be overstated.
    const totalSqFt = (netAreaOverride !== undefined && netAreaOverride !== null)
        ? netAreaOverride
        : roomL * roomW;
    return computeOrderCore(piecesToBuy, tileAreaEach, totalSqFt, piecesPerBox, handlingPct, ratePerBox);
}

function getOpeningsArea() {
    return openings.reduce((sum, o) => sum + o.w * o.h, 0);
}

function readInputsOrShowError(t) {
    const errorBox = document.getElementById('errorBox');
    errorBox.style.display = 'none';

    const roomL = parseFloat(document.getElementById('roomL').value);
    const roomW = parseFloat(document.getElementById('roomW').value);
    const tileL = readTileFt('tileL', 'L');
    const tileW = readTileFt('tileW', 'W');
    const spacerMm = parseFloat(document.getElementById('spacer').value);
    const piecesPerBox = parseFloat(document.getElementById('piecesPerBox').value);
    const handlingPctRaw = parseFloat(document.getElementById('handling').value);
    const handlingPct = isNaN(handlingPctRaw) ? 0 : handlingPctRaw;
    const ratePerBox = parseFloat(document.getElementById('ratePerBox').value) || 0;

    const problems = [];
    if (!(roomL > 0) || !(roomW > 0)) problems.push(t.err_room);
    if (!(tileL > 0) || !(tileW > 0)) problems.push(t.err_tile);
    if (!(spacerMm >= 0)) problems.push(t.err_spacer);
    if (!(piecesPerBox > 0) || !Number.isInteger(piecesPerBox)) problems.push(t.err_box);

    if (problems.length > 0) {
        errorBox.innerHTML = '⚠️ ' + problems.join('<br>');
        errorBox.style.display = 'block';
        return null;
    }

    const spacerFt = spacerMm / 304.8;
    const stepX = tileL + spacerFt;
    const stepY = tileW + spacerFt;
    if (stepX < 0.05 || stepY < 0.05) {
        errorBox.innerHTML = '⚠️ ' + t.err_tiny;
        errorBox.style.display = 'block';
        return null;
    }

    return { roomL, roomW, tileL, tileW, spacerFt, piecesPerBox, handlingPct, ratePerBox };
}

const DEFAULT_PRESET = { floor: '600x600', wall: '300x450' };
const MM_PER_FT = 304.8;

function populateTilePresets() {
    const sel = document.getElementById('tilePreset');
    const previous = sel.value;
    sel.innerHTML = '';
    for (const p of TILE_PRESETS) {
        if (p.use !== currentMode && p.use !== 'both') continue;
        const opt = document.createElement('option');
        opt.value = p.id;
        opt.textContent = p.label;
        sel.appendChild(opt);
    }
    // keep the previous choice if it's valid in this mode, else use the default
    const stillValid = Array.from(sel.options).some(o => o.value === previous);
    sel.value = stillValid ? previous : DEFAULT_PRESET[currentMode];
}

// Flips which tile edge runs along the room's length. For a 2x4 tile this is a
// real design decision, not a formality - it changes the cut pattern and how
// the room reads visually.
function swapTileOrientation() {
    // Adopt anything typed by hand before swapping, or the edit would be lost.
    const l = readTileFt('tileL', 'L');
    const w = readTileFt('tileW', 'W');
    if (isNaN(l) || isNaN(w)) return;
    tileFt.L = w;
    tileFt.W = l;
    syncTileFields();
    calculateAndDraw();
}

function applyTilePreset() {
    const sel = document.getElementById('tilePreset');
    const preset = TILE_PRESETS.find(p => p.id === sel.value);
    if (!preset || !preset.mm) {
        // 'custom' - leave the Advanced values alone and open the panel so the
        // person can actually see the fields they now need to fill in.
        document.getElementById('advancedSection').open = true;
        calculateAndDraw();
        return;
    }
    // Convert mm to feet precisely. 600mm is 1.9685 ft, NOT 2 ft - that ~1.5%
    // difference is exactly what decides whether an edge cut appears.
    tileFt.L = preset.mm[1] / MM_PER_FT;
    tileFt.W = preset.mm[0] / MM_PER_FT;
    syncTileFields();
    document.getElementById('piecesPerBox').value = preset.pcs;
    calculateAndDraw();
}
