// Formats a dimension given in decimal feet into the chosen display unit.
function formatDim(ft) {
    if (currentUnit === 'mm') {
        return Math.round(ft * 304.8) + 'mm';
    }
    if (currentUnit === 'ftin') {
        const wholeFt = Math.floor(ft);
        let inches = Math.round((ft - wholeFt) * 12);
        let adjFt = wholeFt;
        if (inches === 12) { inches = 0; adjFt += 1; }
        return `${adjFt}'${inches}"`;
    }
    return ft.toFixed(2) + "'";
}

let tileImages = []; // uploaded tile pattern photos - multiple for wall tiles with several designs at the same size

function handleTileImage(event) {
    const files = event.target.files;
    if (!files || files.length === 0) return;
    tileImages = []; // fresh upload replaces the previous pattern set
    let loadedCount = 0;
    const total = files.length;
    for (let i = 0; i < total; i++) {
        const file = files[i];
        const reader = new FileReader();
        reader.onload = function (e) {
            const img = new Image();
            img.onload = function () {
                tileImages[i] = img; // preserve upload order for stable pattern numbering
                loadedCount++;
                if (loadedCount === total) calculateAndDraw();
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }
}

function clearTileImage() {
    tileImages = [];
    document.getElementById('tileImageInput').value = '';
    calculateAndDraw();
}

function renderPatternLegend() {
    const t = I18N[currentLang];
    const legend = document.getElementById('patternLegend');
    if (tileImages.length < 2) {
        legend.style.display = 'none';
        legend.innerHTML = '';
        return;
    }
    legend.style.display = 'flex';
    let html = `<div style="width:100%; text-align:center; font-size:12px; font-weight:700; color:#475569; margin-bottom:4px;">${t.patternLegendLabel}</div>`;
    tileImages.forEach((img, i) => {
        if (!img) return;
        html += `<div style="display:flex; align-items:center; gap:6px; font-size:12px; color:#475569;">
            <img src="${img.src}" style="width:28px; height:28px; object-fit:cover; border:2px solid #1e3a8a; border-radius:4px;">
            <span>Pattern ${i + 1}</span>
        </div>`;
    });
    legend.innerHTML = html;
}

// Reusable canvas painter, used for the main layout and the mini comparison grids.
// tileFullW/tileFullH (nominal tile size in ft) are needed to compute the crop
// fraction of the uploaded photo for cut pieces - optional, only used when a pattern is active.
const DIM_MARGIN = 34; // px reserved on the left/top for dimension annotations

// Draws architectural-style overall dimension lines along the top and left,
// so a printed layout carries the room size, not just per-tile sizes.
function drawDimensionLines(ctx, roomL, roomW, scale, m) {
    const wPx = roomL * scale;
    const hPx = roomW * scale;
    const off = 14; // distance from the grid edge to the dimension line

    ctx.save();
    ctx.strokeStyle = '#0f172a';
    ctx.fillStyle = '#0f172a';
    ctx.lineWidth = 1.2;
    ctx.font = 'bold 13px "Segoe UI", Tahoma, sans-serif';

    // --- top (length) ---
    const ty = m - off;
    ctx.beginPath();
    ctx.moveTo(m, ty); ctx.lineTo(m + wPx, ty);
    ctx.moveTo(m, ty - 5); ctx.lineTo(m, ty + 5);              // end tick
    ctx.moveTo(m + wPx, ty - 5); ctx.lineTo(m + wPx, ty + 5);  // end tick
    ctx.stroke();

    const lenLabel = formatDim(roomL);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    const lw = ctx.measureText(lenLabel).width;
    ctx.clearRect(m + wPx / 2 - lw / 2 - 4, ty - 8, lw + 8, 10); // clear line behind text
    ctx.fillStyle = '#fff';
    ctx.fillRect(m + wPx / 2 - lw / 2 - 4, ty - 9, lw + 8, 12);
    ctx.fillStyle = '#0f172a';
    ctx.fillText(lenLabel, m + wPx / 2, ty + 1);

    // --- left (width/height) ---
    const lx = m - off;
    ctx.beginPath();
    ctx.moveTo(lx, m); ctx.lineTo(lx, m + hPx);
    ctx.moveTo(lx - 5, m); ctx.lineTo(lx + 5, m);
    ctx.moveTo(lx - 5, m + hPx); ctx.lineTo(lx + 5, m + hPx);
    ctx.stroke();

    const widLabel = formatDim(roomW);
    ctx.save();
    ctx.translate(lx - 1, m + hPx / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    const ww = ctx.measureText(widLabel).width;
    ctx.fillStyle = '#fff';
    ctx.fillRect(-ww / 2 - 4, -9, ww + 8, 12);
    ctx.fillStyle = '#0f172a';
    ctx.fillText(widLabel, 0, 1);
    ctx.restore();

    ctx.restore();
}

function drawGrid(canvas, cells, scale, spacerFt, showLabels, tileFullW, tileFullH, openingRects, dims) {
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const M = dims ? DIM_MARGIN : 0;
    ctx.save();
    ctx.translate(M, M);

    for (const cell of cells) {
        const { drawX, drawY, drawW, drawH, isCut, colIdx, rowIdx } = cell;
        const px = drawX * scale, py = drawY * scale;
        const pw = drawW * scale, ph = drawH * scale;

        // Diagonal pattern assignment: (col + row) % patternCount guarantees no
        // two adjacent cells (left/right/up/down) ever get the same pattern,
        // and it's deterministic - no reshuffling on unrelated re-renders.
        const hasImages = tileImages.length > 0;
        const patternIdx = hasImages && colIdx !== undefined && rowIdx !== undefined
            ? (colIdx + rowIdx) % tileImages.length
            : 0;
        const activeImage = hasImages ? tileImages[patternIdx] : null;

        if (activeImage) {
            // Crop the source photo proportionally to how much of the physical
            // tile survives the cut, so a cut piece shows a cut-looking crop
            // instead of the full tile image squashed into a smaller box.
            const fracW = tileFullW ? Math.min(1, drawW / tileFullW) : 1;
            const fracH = tileFullH ? Math.min(1, drawH / tileFullH) : 1;
            const srcW = activeImage.width * fracW;
            const srcH = activeImage.height * fracH;
            ctx.drawImage(activeImage, 0, 0, srcW, srcH, px, py, pw, ph);
            if (isCut) {
                ctx.fillStyle = 'rgba(220, 38, 38, 0.28)'; // red tint marks cut pieces over the photo
                ctx.fillRect(px, py, pw, ph);
            }
        } else {
            ctx.fillStyle = isCut ? '#fca5a5' : '#93c5fd';
            ctx.fillRect(px, py, pw, ph);
        }

        ctx.strokeStyle = '#1e3a8a';
        ctx.lineWidth = Math.max(1, spacerFt * scale);
        ctx.strokeRect(px, py, pw, ph);

        if (!showLabels) continue;
        const cellPxW = pw;
        const cellPxH = ph;
        const fontSize = Math.max(7, Math.min(13, Math.min(cellPxW, cellPxH) * 0.22));
        if (cellPxW > 22 && cellPxH > 14) {
            ctx.fillStyle = activeImage ? '#ffffff' : (isCut ? '#7f1d1d' : '#1e3a8a');
            ctx.shadowColor = activeImage ? 'rgba(0,0,0,0.8)' : 'transparent';
            ctx.shadowBlur = activeImage ? 3 : 0;
            ctx.font = `${fontSize}px 'Segoe UI', Tahoma, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const label = `${formatDim(drawW)}×${formatDim(drawH)}`;
            ctx.fillText(label, px + cellPxW / 2, py + cellPxH / 2, cellPxW - 2);
            ctx.shadowBlur = 0;
        }
    }

    // Paint openings last so they read as genuine holes punched through the
    // tiled field, covering any tile edge that runs under them.
    if (openingRects && openingRects.length) {
        for (const r of openingRects) {
            const ox = r.x1 * scale, oy = r.y1 * scale;
            const ow = (r.x2 - r.x1) * scale, oh = (r.y2 - r.y1) * scale;
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(ox, oy, ow, oh);
            ctx.strokeStyle = '#b45309';
            ctx.lineWidth = 2;
            ctx.setLineDash([6, 4]);
            ctx.strokeRect(ox, oy, ow, oh);
            ctx.setLineDash([]);
        }
    }

    ctx.restore(); // undo the dimension-margin translate

    if (dims) {
        // Outline the room itself, so the boundary reads as the wall/room edge
        // rather than the edge of the image.
        ctx.save();
        ctx.strokeStyle = '#1e293b';
        ctx.lineWidth = 3;
        ctx.strokeRect(M, M, dims.L * scale, dims.W * scale);
        ctx.restore();
        drawDimensionLines(ctx, dims.L, dims.W, scale, M);
    }
}

// Skirting is cut as strips FROM the same tile, so the quantity is driven by
// how many strips one tile yields - not by area. A 600x600 tile cut into 100mm
// strips gives 6 strips of 600mm each = 3.6 running metres per tile.
function renderSkirting(tileL, tileW, piecesPerBox, ratePerBox, handlingPct) {
    const t = I18N[currentLang];
    const section = document.getElementById('skirtingSection');
    const on = document.getElementById('skirtingOn').value === 'yes';

    if (!on || currentMode !== 'floor') {
        section.style.display = 'none';
        return;
    }

    const skirtMm = parseFloat(document.getElementById('skirtHeight').value);
    const doorDeductFt = parseToFt(document.getElementById('doorWidth').value) || 0;
    if (!(skirtMm > 0)) { section.style.display = 'none'; return; }

    const skirtFt = skirtMm / MM_PER_FT;

    // Strips are cut across the tile's SHORT side, running its LONG side,
    // which is how a mason gets the most length out of each piece.
    const tileLong = Math.max(tileL, tileW);
    const tileShort = Math.min(tileL, tileW);
    // Epsilon guard: 600mm/100mm evaluates to 5.999999999999999 in floating
    // point, which would silently cost a strip on every clean-dividing size.
    const stripsPerTile = Math.floor(tileShort / skirtFt + 1e-9);

    if (stripsPerTile < 1) {
        document.getElementById('skirtingTable').innerHTML =
            `<tbody><tr><td style="padding:10px; color:#b91c1c; font-weight:600;">${t.skirtTooTall}</td></tr></tbody>`;
        document.getElementById('t_skirtNote').textContent = '';
        section.style.display = 'block';
        return;
    }

    const runPerTile = stripsPerTile * tileLong; // running feet of skirting per tile

    let rows = '';
    let totalPerimeter = 0, totalTiles = 0;

    for (const r of rooms) {
        const rawPerim = 2 * (r.roomL + r.roomW);
        const perim = Math.max(0, rawPerim - doorDeductFt);
        const tilesNeeded = Math.ceil(perim / runPerTile);
        totalPerimeter += perim;
        totalTiles += tilesNeeded;
        rows += `<tr>
            <td style="padding:8px; border-bottom:1px solid #e2e8f0;">${r.name}</td>
            <td style="padding:8px; border-bottom:1px solid #e2e8f0;">${fromFt(r.roomL)} × ${fromFt(r.roomW)}${unitToken()}</td>
            <td style="padding:8px; border-bottom:1px solid #e2e8f0;">${perim.toFixed(1)} ft</td>
            <td style="padding:8px; border-bottom:1px solid #e2e8f0;">${tilesNeeded}</td>
        </tr>`;
    }

    // Pool across rooms, then apply the same breakage buffer as the field tiles.
    const pooledTiles = Math.ceil(totalPerimeter / runPerTile);
    const withBuffer = Math.ceil(pooledTiles * (1 + handlingPct / 100));
    const boxes = Math.ceil(withBuffer / piecesPerBox);
    const cost = boxes * ratePerBox;

    let html = `<thead><tr style="background:#f1f5f9; text-align:left;">
        <th style="padding:8px; border-bottom:2px solid #cbd5e1;">${currentMode === 'wall' ? 'Wall' : 'Room'}</th>
        <th style="padding:8px; border-bottom:2px solid #cbd5e1;">Size</th>
        <th style="padding:8px; border-bottom:2px solid #cbd5e1;">${t.skirtPerimeter}</th>
        <th style="padding:8px; border-bottom:2px solid #cbd5e1;">${t.skirtTiles}</th>
    </tr></thead><tbody>${rows}
        <tr style="background:#f8fafc; font-weight:700;">
            <td style="padding:8px;">TOTAL</td>
            <td style="padding:8px;">—</td>
            <td style="padding:8px;">${totalPerimeter.toFixed(1)} ft</td>
            <td style="padding:8px;">${pooledTiles} (pooled)</td>
        </tr>
        <tr style="background:#ecfdf5; font-weight:700;">
            <td style="padding:8px;" colspan="2">${t.skirtBoxes}</td>
            <td style="padding:8px;" colspan="2">${boxes} box(es) &nbsp;·&nbsp; ${withBuffer} tiles incl. ${handlingPct}% buffer${ratePerBox > 0 ? ` &nbsp;·&nbsp; ₹${cost.toLocaleString('en-IN')}` : ''}</td>
        </tr>
    </tbody>`;

    document.getElementById('skirtingTable').innerHTML = html;
    document.getElementById('t_skirtNote').textContent =
        `${t.skirtNote} ${stripsPerTile} strips × ${fromFt(tileLong)} = ${runPerTile.toFixed(2)} ft of skirting per tile.`;
    section.style.display = 'block';
}

// currently drawn in the big detailed canvas; it carries no special status
// in the ordering math.
// All room/opening/tile dimensions are STORED in feet. The input unit only
// changes how they're typed and displayed, so switching units never loses
// precision. mm is the default because that is what the tile box, the tape on
// site and the mason all speak in.
let inputUnit = 'mm';

const TO_FT = { ft: 1, in: 1 / 12, m: 3.280839895, mm: 1 / 304.8 };

const UNIT_LABEL = { ft: 'ft', ftin: 'ft-in', in: 'inch', m: 'm', mm: 'mm' };

// Every dimension field follows the input-unit dropdown, so its caption has to
// follow too - a box typed in mm must never still read "(ft)".
function unitSuffix() {
    return ` (${UNIT_LABEL[inputUnit] || inputUnit})`;
}

// For a dimension printed inline, e.g. "3048 x 3048 mm". ft-in already carries
// its own marks, so it needs no token appended.
function unitToken() {
    return inputUnit === 'ftin' ? '' : ' ' + (UNIT_LABEL[inputUnit] || inputUnit);
}

// The tile size is the one dimension where display rounding really bites. A
// 600 mm tile is 1.9685 ft; shown as ft-in it reads 1'11.6", and re-reading that
// rounded string would land on 2 ft - the 1.5% error this whole tool exists to
// avoid. So the canonical feet value is kept here and the box is only re-read
// when it no longer holds the number we wrote into it.
let tileFt = { L: null, W: null };

function readTileFt(id, key) {
    const shown = document.getElementById(id).value;
    if (tileFt[key] !== null && shown === fromFt(tileFt[key], true)) return tileFt[key];
    const typed = parseToFt(shown);
    if (!isNaN(typed)) tileFt[key] = typed;
    return typed;
}

function syncTileFields() {
    if (tileFt.L !== null) document.getElementById('tileL').value = fromFt(tileFt.L, true);
    if (tileFt.W !== null) document.getElementById('tileW').value = fromFt(tileFt.W, true);
}

// Parses a value typed in the current input unit and returns feet.
// Returns NaN if unparseable, so callers can reject it.
function parseToFt(raw) {
    if (raw === null || raw === undefined) return NaN;
    const str = String(raw).trim();
    if (str === '') return NaN;

    if (inputUnit === 'ftin') {
        // Accepts: 10'6"  |  10' 6  |  10-6  |  10 6  |  10'  |  10
        const m = str.match(/^(-?\d+(?:\.\d+)?)\s*(?:['’]\s*)?(?:[-\s]\s*)?(\d+(?:\.\d+)?)?\s*(?:["”])?$/);
        if (!m) return NaN;
        const feet = parseFloat(m[1]);
        const inches = m[2] !== undefined ? parseFloat(m[2]) : 0;
        if (isNaN(feet) || inches >= 12) return NaN;
        return feet + inches / 12;
    }

    const num = parseFloat(str);
    if (isNaN(num)) return NaN;
    return num * (TO_FT[inputUnit] || 1);
}

// Formats a stored feet value for display in the current input unit.
// `precise` keeps a decimal where whole units would lie: a 600 mm tile is
// 1'11.6", and rounding that to 2'0" is the very error this tool is about.
// Room-scale dimensions stay on whole mm/inches, which is how they get measured.
function fromFt(ft, precise) {
    if (inputUnit === 'ftin') {
        const whole = Math.floor(ft);
        const rawIn = (ft - whole) * 12;
        let inches = precise ? Math.round(rawIn * 10) / 10 : Math.round(rawIn);
        let adj = whole;
        if (inches >= 12) { inches -= 12; adj += 1; }
        return `${adj}'${inches}"`;
    }
    const val = ft / (TO_FT[inputUnit] || 1);
    // mm/inch read better as whole numbers; ft/m need decimals
    if (inputUnit === 'mm') return String(Math.round(val * (precise ? 10 : 1)) / (precise ? 10 : 1));
    if (inputUnit === 'in') return String(Math.round(val * (precise ? 100 : 10)) / (precise ? 100 : 10));
    return String(Math.round(val * 1000) / 1000);
}

// A sensible spinner step for the unit: whole mm and inches, fractions of a
// foot or metre. Nobody nudges a wall length by a hundredth of a millimetre.
const UNIT_STEP = { ft: '0.1', ftin: '0.1', in: '1', m: '0.01', mm: '1' };

// Openings, rooms and tile sizes are all stored in feet, so switching units is
// purely a re-render - but the values standing in the boxes have to be
// rewritten, or a number typed in ft would be silently re-read as mm.
function setInputUnit(unit) {
    const convertFields = ['openW', 'openH', 'openX', 'openY', 'doorWidth'];
    const heldFt = convertFields.map(id => parseToFt(document.getElementById(id).value));
    // Pick up any hand-typed tile size while the old unit still applies.
    readTileFt('tileL', 'L');
    readTileFt('tileW', 'W');

    inputUnit = unit;

    convertFields.forEach((id, i) => {
        const el = document.getElementById(id);
        el.type = unit === 'ftin' ? 'text' : 'number';
        if (!isNaN(heldFt[i])) el.value = fromFt(heldFt[i]);
        if (unit !== 'ftin') el.step = UNIT_STEP[unit] || '0.1';
    });
    ['tileL', 'tileW'].forEach(id => {
        const el = document.getElementById(id);
        el.type = unit === 'ftin' ? 'text' : 'number';
        if (unit !== 'ftin') el.step = UNIT_STEP[unit] || '0.1';
    });
    // Only once the boxes accept text, or "1'11\"" is rejected and lost.
    syncTileFields();
    ['openW', 'openH', 'openX', 'openY'].forEach(id => {
        document.getElementById(id).placeholder = unit === 'ftin' ? "10'6\"" : '';
    });

    setLang(currentLang); // captions carry the unit, so they have to be redrawn
    calculateAndDraw();
}


// Wall and floor tiles are DIFFERENT products - their box counts must never
// pool together. Each mode therefore keeps its own rooms, openings and tile
// spec; switching tabs swaps the whole working set.
let currentMode = 'floor';

const MODE_INPUT_IDS = ['tilePreset', 'tileL', 'tileW', 'piecesPerBox', 'spacer', 'layoutType', 'handling', 'ratePerBox'];

const modeState = {
    floor: {
        rooms: [{ id: 1, name: 'Room 1', roomL: 10, roomW: 10 }],
        roomIdCounter: 2,
        activeRoomId: 1,
        openings: [],
        openingIdCounter: 1,
        inputs: null // populated lazily on first switch away
    },
    wall: {
        rooms: [{ id: 1, name: 'Wall 1', roomL: 10, roomW: 8 }],
        roomIdCounter: 2,
        activeRoomId: 1,
        openings: [],
        openingIdCounter: 1,
        inputs: null
    }
};

function captureModeInputs() {
    const snap = {};
    for (const id of MODE_INPUT_IDS) {
        const el = document.getElementById(id);
        if (el) snap[id] = el.value;
    }
    // Tile size travels as feet, so a unit change while this mode is parked
    // can't bring its numbers back in the wrong unit.
    readTileFt('tileL', 'L');
    readTileFt('tileW', 'W');
    snap.tileFt = { ...tileFt };
    return snap;
}

function restoreModeInputs(snap) {
    if (!snap) return;
    for (const id of MODE_INPUT_IDS) {
        const el = document.getElementById(id);
        if (el && snap[id] !== undefined) el.value = snap[id];
    }
    if (snap.tileFt) {
        tileFt = { ...snap.tileFt };
        syncTileFields();
    }
}

function setMode(mode) {
    if (mode === currentMode) return;

    // stash the outgoing mode's working set
    const out = modeState[currentMode];
    out.rooms = rooms;
    out.roomIdCounter = roomIdCounter;
    out.activeRoomId = activeRoomId;
    out.openings = openings;
    out.openingIdCounter = openingIdCounter;
    out.inputs = captureModeInputs();

    currentMode = mode;

    // load the incoming mode's working set
    const inn = modeState[mode];
    rooms = inn.rooms;
    roomIdCounter = inn.roomIdCounter;
    activeRoomId = inn.activeRoomId;
    openings = inn.openings;
    openingIdCounter = inn.openingIdCounter;

    document.getElementById('modeFloorBtn').classList.toggle('active', mode === 'floor');
    document.getElementById('modeWallBtn').classList.toggle('active', mode === 'wall');

    populateTilePresets();
    if (inn.inputs) {
        restoreModeInputs(inn.inputs);
    } else {
        document.getElementById('tilePreset').value = DEFAULT_PRESET[mode];
    }

    syncActiveRoomInputs();
    setLang(currentLang); // relabels dimension fields for wall vs floor
    applyTilePreset();
}

let rooms = [{ id: 1, name: 'Room 1', roomL: 10, roomW: 10 }];
let roomIdCounter = 2;
let activeRoomId = 1;

function getActiveRoom() {
    return rooms.find(r => r.id === activeRoomId) || rooms[0];
}

// Mirrors the selected room into the hidden roomL/roomW inputs so every
// existing calculation path keeps reading from one consistent place.
function syncActiveRoomInputs() {
    const active = getActiveRoom();
    if (!active) return;
    document.getElementById('roomL').value = active.roomL;
    document.getElementById('roomW').value = active.roomW;
}

function setActiveRoom(id) {
    activeRoomId = id;
    syncActiveRoomInputs();
    calculateAndDraw();
}

function updateRoomField(id, field, value) {
    const room = rooms.find(r => r.id === id);
    if (!room) return;
    if (field === 'name') {
        room.name = value;
    } else {
        const ft = parseToFt(value); // interprets the value in the chosen input unit
        if (!(ft > 0)) {
            // Reject it and put the last good value back in that exact field,
            // without rebuilding the editor and stealing focus from wherever
            // the person has already tabbed to.
            const inp = document.querySelector(`input[data-room-id="${id}"][data-field="${field}"]`);
            if (inp) inp.value = fromFt(room[field]);
            return;
        }
        room[field] = ft;
    }
    syncActiveRoomInputs();
    calculateAndDraw();
}

// Rebuilding the editor wipes whatever the person is typing in, so only do it
// when the STRUCTURE actually changed. Value-only updates are patched in place.
let roomsEditorSignature = '';

function roomsStructureSignature() {
    return [rooms.map(r => r.id).join(','), currentMode, inputUnit, activeRoomId, currentLang].join('|');
}

function renderRoomsEditor() {
    const t = I18N[currentLang];
    const container = document.getElementById('roomsEditor');
    const sig = roomsStructureSignature();

    // Same structure: just refresh values on fields the person isn't editing,
    // leaving focus, caret position and any half-typed text untouched.
    if (sig === roomsEditorSignature && container.childElementCount > 0) {
        for (const r of rooms) {
            const row = container.querySelector(`[data-room-id="${r.id}"]`);
            if (!row) continue;
            row.querySelectorAll('input').forEach(inp => {
                if (inp === document.activeElement) return; // never clobber the active field
                if (inp.dataset.field === 'name') inp.value = r.name;
                if (inp.dataset.field === 'roomL') inp.value = fromFt(r.roomL);
                if (inp.dataset.field === 'roomW') inp.value = fromFt(r.roomW);
            });
        }
        return;
    }

    // Structure changed - full rebuild, but remember where the caret was so a
    // room being added doesn't throw the person back to the top of the page.
    const prev = document.activeElement;
    const restore = prev && prev.dataset && prev.dataset.roomId
        ? { roomId: prev.dataset.roomId, field: prev.dataset.field, start: prev.selectionStart }
        : null;

    roomsEditorSignature = sig;
    container.innerHTML = '';

    const head = document.createElement('div');
    head.className = rooms.length > 1 ? 'room-row room-head has-actions' : 'room-row room-head';
    head.innerHTML = `
        <span>${currentMode === 'wall' ? 'Wall name' : 'Room name'}</span>
        <span>${(currentMode === 'wall' ? t.dimLenWall : t.dimLenFloor) + unitSuffix()}</span>
        <span>${(currentMode === 'wall' ? t.dimWidWall : t.dimWidFloor) + unitSuffix()}</span>
        ${rooms.length > 1 ? '<span></span><span></span>' : ''}
    `;
    container.appendChild(head);

    // Enter behaves like Tab: commit and advance, which is how people fill a
    // row of measurements without reaching for the mouse.
    function onKey(e) {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        e.target.blur();
        const fields = Array.from(container.querySelectorAll('input'));
        const next = fields[fields.indexOf(e.target) + 1];
        if (next) { next.focus(); next.select(); }
    }

    function selectAllOnFocus(e) {
        // Measurements get replaced, not appended to - so pre-select the value.
        if (e.target.dataset.field !== 'name') e.target.select();
    }

    for (const r of rooms) {
        const isActive = r.id === activeRoomId;
        const row = document.createElement('div');
        row.className = rooms.length > 1 ? 'room-row has-actions' : 'room-row';
        row.dataset.roomId = r.id;
        row.style.cssText = `border:2px solid ${isActive ? '#2563eb' : '#e2e8f0'}; background:${isActive ? '#eff6ff' : '#fff'};`;

        const mk = (field, value, title, isName) => {
            const inp = document.createElement('input');
            inp.type = isName ? 'text' : (inputUnit === 'ftin' ? 'text' : 'number');
            if (!isName && inputUnit !== 'ftin') { inp.step = UNIT_STEP[inputUnit] || '0.1'; inp.min = '0'; }
            if (!isName) inp.inputMode = inputUnit === 'ftin' ? 'text' : 'decimal';
            inp.value = value;
            inp.title = title;
            inp.dataset.roomId = r.id;
            inp.dataset.field = field;
            inp.onfocus = selectAllOnFocus;
            inp.onkeydown = onKey;
            return inp;
        };

        const nameIn = mk('name', r.name, 'Name', true);
        nameIn.className = 'room-name';
        nameIn.placeholder = currentMode === 'wall' ? 'Bathroom N wall' : 'Hall / Bedroom / Kitchen';
        nameIn.oninput = (e) => { const rr = rooms.find(x => x.id === r.id); if (rr) rr.name = e.target.value; };
        nameIn.onchange = () => calculateAndDraw();
        row.appendChild(nameIn);

        const lIn = mk('roomL', fromFt(r.roomL), (currentMode === 'wall' ? t.dimLenWall : t.dimLenFloor) + unitSuffix(), false);
        lIn.onchange = (e) => updateRoomField(r.id, 'roomL', e.target.value);
        row.appendChild(lIn);

        const wIn = mk('roomW', fromFt(r.roomW), (currentMode === 'wall' ? t.dimWidWall : t.dimWidFloor) + unitSuffix(), false);
        wIn.onchange = (e) => updateRoomField(r.id, 'roomW', e.target.value);
        row.appendChild(wIn);

        // With a single room both of these are dead controls - it is already
        // the one being viewed, and it cannot be removed. Rendering them just
        // crowds the row, which matters most on a phone.
        if (rooms.length > 1) {
            const viewBtn = document.createElement('button');
            viewBtn.type = 'button';
            viewBtn.textContent = isActive ? '👁 ' + t.viewing : t.viewBtn;
            viewBtn.onclick = () => setActiveRoom(r.id);
            viewBtn.style.cssText = isActive
                ? 'width:auto; margin:0; padding:8px 12px; font-size:12px; background:#1d4ed8; border:1px solid #1d4ed8;'
                : 'width:auto; margin:0; padding:8px 12px; font-size:12px; background:#fff; color:#475569; border:1px solid #cbd5e1;';
            row.appendChild(viewBtn);

            const rmBtn = document.createElement('button');
            rmBtn.type = 'button';
            rmBtn.textContent = '✕';
            rmBtn.title = t.removeRoom;
            rmBtn.onclick = () => removeRoom(r.id);
            rmBtn.style.cssText = 'width:auto; margin:0; padding:8px 11px; font-size:12px; background:#fff; color:#b91c1c; border:1px solid #fecaca;';
            row.appendChild(rmBtn);
        }

        container.appendChild(row);
    }

    if (restore) {
        const target = container.querySelector(`input[data-room-id="${restore.roomId}"][data-field="${restore.field}"]`);
        if (target) {
            target.focus();
            try { target.setSelectionRange(restore.start, restore.start); } catch (_) { /* number inputs disallow this */ }
        }
    }
}

function addRoom() {
    const isWall = currentMode === 'wall';
    const newId = roomIdCounter;
    rooms.push({
        id: newId,
        name: `${isWall ? 'Wall' : 'Room'} ${rooms.length + 1}`,
        roomL: 10,
        roomW: isWall ? 8 : 10
    });
    roomIdCounter++;
    calculateAndDraw();

    // Land the caret in the new row so the next thing typed goes where expected.
    const inp = document.querySelector(`input[data-room-id="${newId}"][data-field="name"]`);
    if (inp) { inp.focus(); inp.select(); }
}

function removeRoom(id) {
    if (rooms.length <= 1) return; // always keep at least one room
    rooms = rooms.filter(r => r.id !== id);
    if (activeRoomId === id) activeRoomId = rooms[0].id;
    syncActiveRoomInputs();
    calculateAndDraw();
}

function getPrimaryOpeningRects(roomW) {
    return openings.map(o => openingToCanvasRect(o, roomW));
}

function addOpening() {
    const t = I18N[currentLang];
    const nameInput = document.getElementById('openName');
    const w = parseToFt(document.getElementById('openW').value);
    const h = parseToFt(document.getElementById('openH').value);
    const x = parseToFt(document.getElementById('openX').value);
    const y = parseToFt(document.getElementById('openY').value);
    const errorBox = document.getElementById('errorBox');

    if (!(w > 0) || !(h > 0) || !(x >= 0) || !(y >= 0)) {
        errorBox.innerHTML = '⚠️ ' + t.openingNote;
        errorBox.style.display = 'block';
        return;
    }
    const name = nameInput.value.trim() || `Opening ${openings.length + 1}`;
    openings.push({ id: openingIdCounter++, name, w, h, x, y });
    nameInput.value = '';
    calculateAndDraw();
}

function removeOpening(id) {
    openings = openings.filter(o => o.id !== id);
    calculateAndDraw();
}

function renderOpeningChips() {
    const t = I18N[currentLang];
    const section = document.getElementById('openingsListSection');
    section.innerHTML = '';
    if (openings.length === 0) {
        section.style.display = 'none';
        return;
    }
    section.style.display = 'flex';
    for (const o of openings) {
        const chip = document.createElement('div');
        chip.style.cssText = 'display:flex; align-items:center; gap:6px; background:#fef3c7; border:1px solid #fbbf24; border-radius:16px; padding:4px 6px 4px 12px; font-size:13px; color:#78350f;';
        chip.innerHTML = `<span>${o.name} — ${fromFt(o.w)}×${fromFt(o.h)}${unitToken()} @ ${fromFt(o.x)},${fromFt(o.y)}</span>`;
        const rmBtn = document.createElement('button');
        rmBtn.type = 'button';
        rmBtn.textContent = '✕';
        rmBtn.title = t.removeRoom;
        rmBtn.onclick = () => removeOpening(o.id);
        rmBtn.style.cssText = 'width:auto; margin:0; padding:2px 7px; font-size:11px; background:#78716c; border-radius:50%;';
        chip.appendChild(rmBtn);
        section.appendChild(chip);
    }
}

function renderRoomsAndCombinedTotal(tileL, tileW, spacerFt, piecesPerBox, handlingPct, ratePerBox, activeCells, activeFull, activeCut) {
    const t = I18N[currentLang];
    const combinedSection = document.getElementById('combinedRoomsSection');

    renderRoomsEditor();

    // With only one room, the big canvas above already tells the whole story -
    // a one-card gallery and a "combined" total would just be noise.
    if (rooms.length <= 1) {
        combinedSection.style.display = 'none';
        return;
    }

    const layoutType = document.getElementById('layoutType').value;
    const showCost = ratePerBox > 0;

    // Every room is treated identically. The active room reuses the grid that
    // was already simulated for the big canvas rather than recomputing it.
    const allRooms = rooms.map(r => {
        if (r.id === activeRoomId) {
            return { ...r, cells: activeCells, fullTiles: activeFull, cutTiles: activeCut, isActive: true };
        }
        const g = simulateGrid(layoutType, r.roomL, r.roomW, tileL, tileW, spacerFt);
        return { ...r, cells: g.cells, fullTiles: g.fullTiles, cutTiles: g.cutTiles, isActive: false };
    });

    const gallery = document.getElementById('roomsGallery');
    gallery.innerHTML = '';
    const miniMaxPx = 200;

    let sumPieces = 0, sumArea = 0, sumSeparateBoxes = 0;

    for (const room of allRooms) {
        const piecesToBuy = room.fullTiles + room.cutTiles;
        const roomOrder = computeOrderCore(piecesToBuy, tileL * tileW, room.roomL * room.roomW, piecesPerBox, handlingPct, ratePerBox);
        sumPieces += piecesToBuy;
        sumArea += room.roomL * room.roomW;
        sumSeparateBoxes += roomOrder.boxesNeeded;

        const card = document.createElement('div');
        card.style.cssText = `border:2px solid ${room.isActive ? '#2563eb' : '#e2e8f0'}; border-radius:8px; padding:8px; text-align:center; background:${room.isActive ? '#eff6ff' : '#fff'}; cursor:pointer;`;
        card.title = t.viewBtn;
        card.onclick = () => setActiveRoom(room.id);

        const caption = document.createElement('div');
        caption.style.cssText = 'font-size:12px; font-weight:700; color:#1e293b; margin-bottom:6px;';
        caption.textContent = room.name + (room.isActive ? ' 👁' : '');
        card.appendChild(caption);

        const miniScale = Math.min(miniMaxPx / room.roomL, miniMaxPx / room.roomW);
        const miniCanvas = document.createElement('canvas');
        miniCanvas.width = room.roomL * miniScale;
        miniCanvas.height = room.roomW * miniScale;
        miniCanvas.style.cssText = 'border:2px solid #1e293b; max-width:100%; height:auto; background:#fff;';
        card.appendChild(miniCanvas);
        drawGrid(miniCanvas, room.cells, miniScale, spacerFt, false, tileL, tileW, room.isActive ? getPrimaryOpeningRects(room.roomW) : null);

        const subCaption = document.createElement('div');
        subCaption.style.cssText = 'font-size:11px; color:#64748b; margin-top:6px;';
        subCaption.textContent = `${fromFt(room.roomL)}×${fromFt(room.roomW)}${unitToken()} · ${piecesToBuy} pcs`;
        card.appendChild(subCaption);

        gallery.appendChild(card);
    }

    // Combined (pooled) order vs sum of separately-rounded orders
    const combinedOrder = computeOrderCore(sumPieces, tileL * tileW, sumArea, piecesPerBox, handlingPct, ratePerBox);
    const boxesSaved = sumSeparateBoxes - combinedOrder.boxesNeeded;

    let combinedHtml = `<tbody>
        <tr style="background:#ecfdf5; font-weight:700;">
            <td style="padding:8px; border-bottom:1px solid #e2e8f0;">${t.row_combinedTotal}</td>
            <td style="padding:8px; border-bottom:1px solid #e2e8f0;">${combinedOrder.boxesNeeded} boxes</td>
            ${showCost ? `<td style="padding:8px; border-bottom:1px solid #e2e8f0;">₹${combinedOrder.estimatedCost.toLocaleString('en-IN')}</td>` : '<td></td>'}
        </tr>
        <tr>
            <td style="padding:8px; border-bottom:1px solid #e2e8f0; color:#64748b;">${t.row_separateTotal}</td>
            <td style="padding:8px; border-bottom:1px solid #e2e8f0; color:#64748b;">${sumSeparateBoxes} boxes</td>
            <td style="padding:8px; border-bottom:1px solid #e2e8f0;"></td>
        </tr>`;
    if (boxesSaved > 0) {
        combinedHtml += `<tr>
            <td colspan="3" style="padding:8px; color:#0f766e; font-weight:700;">✓ ${boxesSaved} ${t.boxesSaved}</td>
        </tr>`;
    }
    combinedHtml += '</tbody>';
    document.getElementById('combinedRoomsTable').innerHTML = combinedHtml;
    combinedSection.style.display = 'block';
}

function downloadReport() {
    const t = I18N[currentLang];
    const inputs = readInputsOrShowError(t);
    if (!inputs) return;
    const { roomL, roomW, tileL, tileW, spacerFt, piecesPerBox, handlingPct, ratePerBox } = inputs;
    const layoutType = document.getElementById('layoutType').value;
    const { fullTiles, cutTiles, cells } = simulateGrid(layoutType, roomL, roomW, tileL, tileW, spacerFt, getPrimaryOpeningRects(roomW));
    const dateStr = new Date().toLocaleDateString('en-IN', { year: 'numeric', month: 'long', day: 'numeric' });
    const showCost = ratePerBox > 0;

    // Renders a room's grid WITH dimension labels, at print resolution.
    function renderRoomImage(rL, rW, cellsIn, isActive) {
        const maxPx = 560; // large enough that per-tile labels survive printing
        const scale = Math.min(maxPx / rL, maxPx / rW);
        const c = document.createElement('canvas');
        c.width = rL * scale + DIM_MARGIN + 6;
        c.height = rW * scale + DIM_MARGIN + 6;
        drawGrid(c, cellsIn, scale, spacerFt, true, tileL, tileW, isActive ? getPrimaryOpeningRects(rW) : null, { L: rL, W: rW });
        return c.toDataURL('image/png');
    }

    let roomsRows = '';
    let roomImagesHtml = '';
    let sumPieces = 0, sumArea = 0, sumSeparateBoxes = 0, sumFull = 0, sumCut = 0;

    for (const r of rooms) {
        const isActive = r.id === activeRoomId;
        const rg = isActive
            ? { cells, fullTiles, cutTiles }
            : simulateGrid(layoutType, r.roomL, r.roomW, tileL, tileW, spacerFt);
        const pieces = rg.fullTiles + rg.cutTiles;
        const roomArea = r.roomL * r.roomW;
        const roomNet = isActive ? roomArea - getOpeningsArea() : roomArea;
        const ro = computeOrderCore(pieces, tileL * tileW, roomNet, piecesPerBox, handlingPct, ratePerBox);

        sumPieces += pieces;
        sumArea += roomNet;
        sumSeparateBoxes += ro.boxesNeeded;
        sumFull += rg.fullTiles;
        sumCut += rg.cutTiles;

        roomsRows += `<tr>
            <td><b>${r.name}</b>${isActive && openings.length ? ' <span style="color:#b45309;">(has openings)</span>' : ''}</td>
            <td>${fromFt(r.roomL)} × ${fromFt(r.roomW)}${unitToken()}</td>
            <td>${roomNet.toFixed(1)}</td>
            <td>${rg.fullTiles}</td>
            <td>${rg.cutTiles}</td>
            <td>${pieces}</td>
            <td>${ro.boxesNeeded}</td>
        </tr>`;

        const roomImg = renderRoomImage(r.roomL, r.roomW, rg.cells, isActive);
        roomImagesHtml += `<div class="room-card">
            <div class="room-name">${r.name}</div>
            <img src="${roomImg}" alt="${r.name} layout">
            <div class="room-meta">${fromFt(r.roomL)} × ${fromFt(r.roomW)}${unitToken()} &nbsp;·&nbsp; ${rg.fullTiles} full + ${rg.cutTiles} cut = <b>${pieces} pcs</b></div>
        </div>`;
    }

    const combined = computeOrderCore(sumPieces, tileL * tileW, sumArea, piecesPerBox, handlingPct, ratePerBox);
    const grandBoxes = combined.boxesNeeded;
    const grandCost = combined.estimatedCost;
    const boxesSaved = sumSeparateBoxes - grandBoxes;

    // Tile size printed in mm as well as feet - mm is what's on the box label.
    const tileMmL = Math.round(tileL * MM_PER_FT);
    const tileMmW = Math.round(tileW * MM_PER_FT);

    // --- Layout comparison, same data the on-screen comparison shows ---
    // The active room is the one the comparison is run against, exactly as on
    // screen; the alignment/direction actually ordered is flagged in the table.
    const cmp = buildLayoutComparison(t, roomL, roomW, tileL, tileW, spacerFt, piecesPerBox, handlingPct, ratePerBox);
    const activeRoomName = getActiveRoom().name;

    // Renders one comparison option at print resolution. Smaller than the room
    // drawings - there are up to ten of them and they are for eyeballing where
    // the cuts land, not for measuring off.
    function renderCompareImage(r) {
        const maxPx = 230;
        const scale = Math.min(maxPx / roomL, maxPx / roomW);
        const c = document.createElement('canvas');
        c.width = roomL * scale;
        c.height = roomW * scale;
        drawGrid(c, r.cells, scale, spacerFt, false, r.tileL, r.tileW, getPrimaryOpeningRects(roomW));
        return c.toDataURL('image/png');
    }

    // Flags the row that matches what the rest of the report was costed on.
    const isSelectedRow = r => r.key === layoutType
        && Math.abs(r.tileL - tileL) < 0.01 && Math.abs(r.tileW - tileW) < 0.01;

    let compareRows = '';
    let compareImagesHtml = '';
    for (const r of cmp.rows) {
        const isBest = r.minSliver === cmp.bestSliver;
        const selected = isSelectedRow(r);
        const risky = r.sliverRatio < 0.33;
        const tags = `${isBest ? ' <b style="color:#0f766e;">' + t.bestTag + '</b>' : ''}${selected ? ' <b style="color:#2563eb;">' + t.reportCompareSelected + '</b>' : ''}`;
        compareRows += `<tr class="${selected ? 'selected-row' : (isBest ? 'best-row' : '')}">
            <td>${r.label}${tags}</td>
            <td>${r.fullTiles}</td>
            <td>${r.cutTiles}</td>
            <td style="color:${risky ? '#b91c1c' : '#0f766e'}; font-weight:700;">${(r.minSliver * 12).toFixed(1)}"${risky ? ' ⚠️' : ''}</td>
            <td>${r.boxesNeeded}</td>
            ${showCost ? `<td>₹${r.estimatedCost.toLocaleString('en-IN')}</td>` : ''}
        </tr>`;

        compareImagesHtml += `<div class="room-card${selected ? ' selected-card' : (isBest ? ' best-card' : '')}">
            <div class="room-name">${r.label}${tags}</div>
            <img src="${renderCompareImage(r)}" alt="${r.label}">
            <div class="room-meta" style="color:${risky ? '#b91c1c' : '#64748b'};">${r.cutTiles} cuts · smallest edge ${(r.minSliver * 12).toFixed(1)}"</div>
        </div>`;
    }

    const compareSectionHtml = `
        <h3>${t.reportCompareTitle}</h3>
        <div class="meta">${t.reportCompareFor}: <b>${activeRoomName}</b> (${fromFt(roomL)} × ${fromFt(roomW)}${unitToken()})</div>
        <table>
            <thead><tr>
                <th>${t.col_layout}</th><th>${t.col_full}</th><th>${t.col_cut}</th>
                <th>${t.col_sliver}</th><th>${t.col_boxes}</th>${showCost ? `<th>${t.col_cost}</th>` : ''}
            </tr></thead>
            <tbody>${compareRows}</tbody>
        </table>
        <div class="note">${t.reportCompareNote}</div>
        <div class="note">${t.layoutCompareNote}</div>
        <div class="compare-gallery">${compareImagesHtml}</div>`;

    const openingsTable = openings.length ? `
        <h3>Openings Deducted</h3>
        <table><thead><tr><th>Name</th><th>Size${unitSuffix()}</th><th>Position (from bottom-left)</th><th>Area</th></tr></thead><tbody>
        ${openings.map(o => `<tr><td>${o.name}</td><td>${fromFt(o.w)} × ${fromFt(o.h)}${unitToken()}</td><td>${fromFt(o.x)} from left, ${fromFt(o.y)} from bottom</td><td>${(o.w * o.h).toFixed(2)} sq.ft</td></tr>`).join('')}
        <tr class="subtotal"><td colspan="3">Total deducted</td><td>${getOpeningsArea().toFixed(2)} sq.ft</td></tr>
        </tbody></table>` : '';

    const reportHtml = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${t.reportTitle}</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; padding: 30px; color: #1e293b; max-width: 900px; margin: auto; }
        h1 { color: #2563eb; border-bottom: 3px solid #2563eb; padding-bottom: 8px; margin-bottom: 4px; }
        h3 { margin-top: 26px; color: #334155; border-left: 4px solid #2563eb; padding-left: 8px; }
        table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 14px; }
        th, td { padding: 8px; border-bottom: 1px solid #e2e8f0; text-align: left; }
        th { background: #f1f5f9; font-size: 13px; }
        .grand { background: #ecfdf5; font-weight: 700; font-size: 16px; }
        .subtotal { background: #f8fafc; font-weight: 700; }
        .saved { color: #0f766e; font-weight: 700; }
        .meta { color: #64748b; font-size: 13px; margin-bottom: 18px; }
        img { max-width: 100%; margin: 8px 0; }
        .room-gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; margin: 14px 0; }
        .room-card { border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px; text-align: center; page-break-inside: avoid; }
        .room-name { font-size: 14px; font-weight: 700; margin-bottom: 6px; }
        .room-meta { font-size: 12px; color: #64748b; margin-top: 6px; }
        .compare-gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin: 14px 0; }
        .best-row { background: #ecfdf5; }
        .selected-row { background: #eff6ff; font-weight: 700; }
        .best-card { border-color: #10b981; background: #f0fdf4; }
        .selected-card { border: 2px solid #2563eb; background: #eff6ff; }
        .note { font-size: 12px; color: #64748b; background: #f8fafc; padding: 8px 10px; border-radius: 6px; margin: 8px 0; }
        .legend { display:flex; gap:18px; justify-content:center; font-size:12px; margin:10px 0 4px; }
        .sw { display:inline-block; width:14px; height:14px; border-radius:3px; vertical-align:-2px; margin-right:5px; }
        @media print { button { display: none; } h3 { page-break-after: avoid; } }
    </style></head><body>
        <h1>📐 ${t.reportTitle}</h1>
        <div class="meta">${t.reportDate}: ${dateStr} &nbsp;|&nbsp; <b style="color:#2563eb;">${currentMode === 'wall' ? t.modeWall : t.modeFloor}</b> &nbsp;|&nbsp; ${rooms.length} ${currentMode === 'wall' ? 'wall(s)' : 'room(s)'}</div>

        <h3>${t.reportTileSpec}</h3>
        <table>
            <tr><td>Tile Size</td><td><b>${tileMmL} × ${tileMmW} mm</b> &nbsp;(${tileL.toFixed(3)}' × ${tileW.toFixed(3)}')</td></tr>
            <tr><td>Tile Area (each)</td><td>${(tileL * tileW).toFixed(3)} sq.ft</td></tr>
            <tr><td>Pieces per Box</td><td>${piecesPerBox}</td></tr>
            <tr><td>Box Coverage</td><td>${(piecesPerBox * tileL * tileW).toFixed(2)} sq.ft / box</td></tr>
            <tr><td>Grout Spacer</td><td>${document.getElementById('spacer').value} mm</td></tr>
            <tr><td>Layout Alignment</td><td>${document.getElementById('layoutType').selectedOptions[0].text}</td></tr>
            <tr><td>Handling / Breakage Buffer</td><td>${handlingPct}%</td></tr>
            ${showCost ? `<tr><td>Rate per Box</td><td>₹${ratePerBox.toLocaleString('en-IN')}</td></tr>` : ''}
            <tr><td>Measurements shown in</td><td>${document.getElementById('inputUnit').selectedOptions[0].text}</td></tr>
        </table>

        ${openingsTable}

        <h3>${t.reportRoomBreakdown}</h3>
        <table>
            <thead><tr>
                <th>${currentMode === 'wall' ? 'Wall' : 'Room'}</th><th>Size${unitSuffix()}</th><th>Net Area (sq.ft)</th>
                <th>Full</th><th>Cut</th><th>Total pcs</th><th>Boxes if alone</th>
            </tr></thead>
            <tbody>
                ${roomsRows}
                <tr class="subtotal">
                    <td>TOTAL</td><td>—</td><td>${sumArea.toFixed(1)}</td>

                </tr>

        <table>
            <tr class="grand"><td>Boxes to Order (pooled)</td><td>${grandBoxes} boxes</td></tr>
            ${showCost ? `<tr class="grand"><td>Estimated Cost</td><td>₹${grandCost.toLocaleString('en-IN')}</td></tr>` : ''}
            <tr><td>Pieces needed / shipped</td><td>${combined.piecesWithBuffer} / ${combined.totalPiecesShipped} pcs</td></tr>
            <tr><td>Total tile area shipped</td><td>${combined.areaWithBuffer.toFixed(1)} sq.ft</td></tr>
            <tr><td>Net area to cover</td><td>${sumArea.toFixed(1)} sq.ft</td></tr>
            <tr><td>Cut / geometric wastage</td><td>${combined.geometricWastePct.toFixed(1)}%</td></tr>
            <tr><td>If ordered room-by-room instead</td><td>${sumSeparateBoxes} boxes</td></tr>
            ${boxesSaved > 0 ? `<tr><td class="saved">✓ Saved by pooling</td><td class="saved">${boxesSaved} box(es)</td></tr>` : ''}
        </table>

        <h3>Layout Drawings</h3>
        <div class="legend">
            <span><span class="sw" style="background:#93c5fd; border:1px solid #2563eb;"></span>Full Tile</span>
            <span><span class="sw" style="background:#fca5a5; border:1px solid #ef4444;"></span>Cut Piece</span>
            ${openings.length ? '<span><span class="sw" style="background:#fff; border:2px dashed #b45309;"></span>Opening</span>' : ''}
        </div>
        <div class="room-gallery">${roomImagesHtml}</div>

        ${compareSectionHtml}

        <div style="margin-top:24px; font-size:11px; color:#94a3b8; border-top:1px solid #e2e8f0; padding-top:10px;">
            Cut pieces consume a full source tile. Pieces-per-box is a typical value — confirm against the printed box label before ordering.
        </div>

        <button onclick="window.print()" style="padding:10px 20px; background:#1e293b; color:#fff; border:none; border-radius:6px; font-size:14px; cursor:pointer; margin-top:16px;">🖨️ Print / Save as PDF</button>
    </body></html>`;

    const reportWindow = window.open('', '_blank');
    if (!reportWindow) {
        alert('Please allow popups to download the report.');
        return;
    }
    reportWindow.document.write(reportHtml);
    reportWindow.document.close();
}

function calculateAndDraw() {
    const t = I18N[currentLang];
    const inputs = readInputsOrShowError(t);
    if (!inputs) return;
    const { roomL, roomW, tileL, tileW, spacerFt, piecesPerBox, handlingPct, ratePerBox } = inputs;
    const layoutType = document.getElementById('layoutType').value;

    const canvas = document.getElementById('layoutCanvas');
    const maxPx = 550;
    const scale = Math.min(maxPx / roomL, maxPx / roomW);
    // extra room on the left/top for the dimension lines, plus a little breathing space
    canvas.width = roomL * scale + DIM_MARGIN + 6;
    canvas.height = roomW * scale + DIM_MARGIN + 6;

    const openRects = getPrimaryOpeningRects(roomW);
    const { fullTiles, cutTiles, cells } = simulateGrid(layoutType, roomL, roomW, tileL, tileW, spacerFt, openRects);
    drawGrid(canvas, cells, scale, spacerFt, true, tileL, tileW, openRects, { L: roomL, W: roomW });
    renderPatternLegend();
    renderOpeningChips();

    const order = computeOrder(fullTiles, cutTiles, tileL, tileW, roomL, roomW, piecesPerBox, handlingPct, ratePerBox, roomL * roomW - getOpeningsArea());
    const cutPct = order.piecesToBuy > 0 ? ((cutTiles / order.piecesToBuy) * 100).toFixed(0) : 0;

    document.getElementById('autoWasteDisplay').value = order.geometricWastePct.toFixed(1) + '%';
    document.getElementById('boxCoverageDisplay').value = order.boxCoverageSqFt.toFixed(2) + ' sq.ft';

    let orderHtml = `
        <div class="order-item">
            <div class="label">${t.boxesNeeded}</div>
            <div class="value highlight">${order.boxesNeeded} boxes</div>
        </div>
        <div class="order-item">
            <div class="label">${t.pieces}</div>
            <div class="value">${order.piecesWithBuffer} / ${order.totalPiecesShipped} pcs</div>
        </div>
        <div class="order-item">
            <div class="label">${t.areaWithWastage}</div>
            <div class="value">${order.areaWithBuffer.toFixed(1)} sq.ft</div>
        </div>
    `;
    if (ratePerBox > 0) {
        orderHtml += `
        <div class="order-item">
            <div class="label">${t.estCost}</div>
            <div class="value highlight">₹${order.estimatedCost.toLocaleString('en-IN')}</div>
        </div>`;
    }
    document.getElementById('orderSummary').innerHTML = orderHtml;

    document.getElementById('statsBox').innerHTML = `
        <span>${t.roomArea}: <b>${order.totalSqFt.toFixed(1)} sq.ft</b></span>
        <span>${t.fullTiles}: <b>${fullTiles} pcs</b></span>
        <span>${t.cutTiles}: <b>${cutTiles} pcs (${cutPct}%)</b></span>
        ${openings.length ? `<span>${t.openingArea}: <b>−${getOpeningsArea().toFixed(1)} sq.ft</b></span>` : ''}
    `;

    // --- Manual method vs this app ---
    // Manual/napkin math: total room area / tile area, rounded up.
    // No cut-piece awareness, no spacer gap, no handling buffer.
    const naivePieces = Math.ceil(order.totalSqFt / order.tileAreaEach);
    const naiveBoxes = Math.ceil(naivePieces / piecesPerBox);
    const boxGap = order.boxesNeeded - naiveBoxes;

    let manualHtml = `<thead><tr style="background:#f1f5f9; text-align:left;">
        <th style="padding:8px; border-bottom:2px solid #cbd5e1;">${t.col_method}</th>
        <th style="padding:8px; border-bottom:2px solid #cbd5e1;">${t.col_pieces}</th>
        <th style="padding:8px; border-bottom:2px solid #cbd5e1;">${t.col_boxes}</th>
    </tr></thead><tbody>
        <tr>
            <td style="padding:8px; border-bottom:1px solid #e2e8f0;">${t.row_manual}</td>
            <td style="padding:8px; border-bottom:1px solid #e2e8f0;">${naivePieces}</td>
            <td style="padding:8px; border-bottom:1px solid #e2e8f0;">${naiveBoxes}</td>
        </tr>
        <tr style="background:#ecfdf5; font-weight:700;">
            <td style="padding:8px; border-bottom:1px solid #e2e8f0;">${t.row_app}</td>
            <td style="padding:8px; border-bottom:1px solid #e2e8f0;">${order.piecesWithBuffer}</td>
            <td style="padding:8px; border-bottom:1px solid #e2e8f0;">${order.boxesNeeded}</td>
        </tr>
        <tr>
            <td style="padding:8px; color:${boxGap > 0 ? '#b91c1c' : '#64748b'}; font-weight:600;">${t.row_gap}</td>
            <td style="padding:8px;" colspan="2">${boxGap > 0 ? '⚠️ ' + boxGap + ' ' + t.gapUnder : t.gapNone}</td>
        </tr>
    </tbody>`;
    document.getElementById('manualCompareTable').innerHTML = manualHtml;

    // --- Visual: naive full-tile-only grid vs this app's actual grid ---
    const miniMaxPx = 260;
    const miniScale2 = Math.min(miniMaxPx / roomL, miniMaxPx / roomW);

    const naiveCanvas = document.getElementById('naiveCanvas');
    naiveCanvas.width = roomL * miniScale2;
    naiveCanvas.height = roomW * miniScale2;
    const { cells: naiveCells } = simulateNaiveGrid(roomL, roomW, tileL, tileW, spacerFt);
    drawGrid(naiveCanvas, naiveCells, miniScale2, spacerFt, false, tileL, tileW, openRects);

    const appMiniCanvas = document.getElementById('appMiniCanvas');
    appMiniCanvas.width = roomL * miniScale2;
    appMiniCanvas.height = roomW * miniScale2;
    drawGrid(appMiniCanvas, cells, miniScale2, spacerFt, false, tileL, tileW, openRects);

    renderRoomsAndCombinedTotal(tileL, tileW, spacerFt, piecesPerBox, handlingPct, ratePerBox, cells, fullTiles, cutTiles);
    renderSkirting(tileL, tileW, piecesPerBox, ratePerBox, handlingPct);

    if (document.getElementById('compareSection').dataset.open === '1') {
        compareLayouts();
    }
    if (document.getElementById('wasteCompareSection').dataset.open === '1') {
        compareWastage();
    }
}

// Every alignment crossed with every meaningful tile orientation, evaluated
// against one room. Shared by the on-screen comparison and the printed report
// so the two can never drift apart.
function buildLayoutComparison(t, roomL, roomW, tileL, tileW, spacerFt, piecesPerBox, handlingPct, ratePerBox) {
    const layoutTypes = [
        { key: 'center', label: t.opt_center },
        { key: 'tl', label: t.opt_tl },
        { key: 'tr', label: t.opt_tr },
        { key: 'bl', label: t.opt_bl },
        { key: 'br', label: t.opt_br }
    ];

    // A square tile has no meaningful orientation, so only test the flip when
    // the tile is actually rectangular.
    const isSquare = Math.abs(tileL - tileW) < 0.01;
    const orientations = isSquare
        ? [{ L: tileL, W: tileW }]
        : [
            { L: tileL, W: tileW },
            { L: tileW, W: tileL }
        ];

    // One alignment at one tile orientation. Pulled out of the loop so the
    // per-card rotate button can re-evaluate a single card on demand, instead
    // of rebuilding the whole comparison.
    function evaluateLayout(ltKey, baseLabel, tL, tW) {
        // Read the tag off the geometry, not off which way round the fields
        // happen to be typed - otherwise entering a 1x2 tile prints "long side
        // along length" for the option where the long side runs across.
        const tag = isSquare
            ? ''
            : (tL >= tW ? ` — ${t.orientLong}` : ` — ${t.orientShort}`);
        const { fullTiles, cutTiles, cells } = simulateGrid(ltKey, roomL, roomW, tL, tW, spacerFt, getPrimaryOpeningRects(roomW));
        const order = computeOrder(fullTiles, cutTiles, tL, tW, roomL, roomW, piecesPerBox, handlingPct, ratePerBox, roomL * roomW - getOpeningsArea());

        // The number of tiles NEVER changes with alignment - shifting a grid
        // across a rectangle can't change how many tiles cover it. What changes
        // is the size of the edge pieces, and a razor-thin sliver is the real
        // on-site problem: hard to cut, prone to snapping, and it looks bad.
        let minSliver = Infinity;
        for (const c of cells) {
            if (c.drawW < tL - 0.02) minSliver = Math.min(minSliver, c.drawW);
            if (c.drawH < tW - 0.02) minSliver = Math.min(minSliver, c.drawH);
        }
        if (minSliver === Infinity) minSliver = Math.min(tL, tW);

        // Rule of thumb: an edge piece under a third of the tile is trouble.
        const sliverRatio = minSliver / Math.min(tL, tW);
        return {
            key: ltKey, baseLabel, label: baseLabel + tag,
            tileL: tL, tileW: tW,
            fullTiles, cutTiles, cells, minSliver, sliverRatio, ...order
        };
    }

    const rows = [];
    for (const o of orientations) {
        for (const lt of layoutTypes) {
            rows.push(evaluateLayout(lt.key, lt.label, o.L, o.W));
        }
    }

    // Best = the layout whose worst edge piece is the LARGEST (most workable).
    const bestSliver = Math.max(...rows.map(r => r.minSliver));

    return { rows, bestSliver, isSquare, evaluateLayout };
}

function compareLayouts() {
    const t = I18N[currentLang];
    const inputs = readInputsOrShowError(t);
    if (!inputs) return;
    const { roomL, roomW, tileL, tileW, spacerFt, piecesPerBox, handlingPct, ratePerBox } = inputs;

    const { rows, bestSliver, isSquare, evaluateLayout } =
        buildLayoutComparison(t, roomL, roomW, tileL, tileW, spacerFt, piecesPerBox, handlingPct, ratePerBox);

    const showCost = ratePerBox > 0;
    let html = `<thead><tr style="background:#f1f5f9; text-align:left;">
        <th style="padding:8px; border-bottom:2px solid #cbd5e1;">${t.col_layout}</th>
        <th style="padding:8px; border-bottom:2px solid #cbd5e1;">${t.col_full}</th>
        <th style="padding:8px; border-bottom:2px solid #cbd5e1;">${t.col_cut}</th>
        <th style="padding:8px; border-bottom:2px solid #cbd5e1;">${t.col_sliver}</th>
        <th style="padding:8px; border-bottom:2px solid #cbd5e1;">${t.col_boxes}</th>
        ${showCost ? `<th style="padding:8px; border-bottom:2px solid #cbd5e1;">${t.col_cost}</th>` : ''}
    </tr></thead><tbody>`;

    for (const r of rows) {
        const isBest = r.minSliver === bestSliver;
        const risky = r.sliverRatio < 0.33;
        html += `<tr style="${isBest ? 'background:#ecfdf5; font-weight:700;' : ''}">
            <td style="padding:8px; border-bottom:1px solid #e2e8f0;">${r.label}${isBest ? ' ' + t.bestTag : ''}</td>
            <td style="padding:8px; border-bottom:1px solid #e2e8f0;">${r.fullTiles}</td>
            <td style="padding:8px; border-bottom:1px solid #e2e8f0;">${r.cutTiles}</td>
            <td style="padding:8px; border-bottom:1px solid #e2e8f0; color:${risky ? '#b91c1c' : '#0f766e'}; font-weight:700;">
                ${(r.minSliver * 12).toFixed(1)}" ${risky ? '⚠️' : ''}
            </td>
            <td style="padding:8px; border-bottom:1px solid #e2e8f0;">${r.boxesNeeded}</td>
            ${showCost ? `<td style="padding:8px; border-bottom:1px solid #e2e8f0;">₹${r.estimatedCost.toLocaleString('en-IN')}</td>` : ''}
        </tr>`;
    }
    html += `</tbody><tfoot><tr><td colspan="${showCost ? 6 : 5}" style="padding:10px; font-size:12px; color:#64748b; background:#f8fafc;">${t.layoutCompareNote}</td></tr></tfoot>`;

    document.getElementById('compareTable').innerHTML = html;

    // --- Mini visual grids, one per layout option ---
    const gridsContainer = document.getElementById('compareGrids');
    gridsContainer.innerHTML = '';
    const miniMaxPx = 220;
    const miniScale = Math.min(miniMaxPx / roomL, miniMaxPx / roomW);

    for (const r of rows) {
        // `current` is what this card is showing right now. It starts as the
        // row from the table and is replaced in place when the card is rotated,
        // so one card can be flipped without disturbing its neighbours.
        let current = r;

        const card = document.createElement('div');

        const caption = document.createElement('div');
        caption.style.cssText = 'font-size:12px; font-weight:700; color:#1e293b; margin-bottom:6px;';
        card.appendChild(caption);

        const miniCanvas = document.createElement('canvas');
        miniCanvas.style.cssText = 'border:2px solid #1e293b; max-width:100%; height:auto; background:#fff;';
        card.appendChild(miniCanvas);

        const subCaption = document.createElement('div');
        subCaption.style.cssText = 'font-size:11px; margin-top:6px;';
        card.appendChild(subCaption);

        const paintCard = () => {
            const isBest = current.minSliver === bestSliver;
            card.style.cssText = `border:2px solid ${isBest ? '#10b981' : '#e2e8f0'}; border-radius:8px; padding:8px; text-align:center; background:${isBest ? '#f0fdf4' : '#fff'};`;
            caption.textContent = current.label + (isBest ? ' ' + t.bestTag : '');
            // Reassigning width/height also clears the canvas, so a rotated
            // grid never paints on top of the previous one.
            miniCanvas.width = roomL * miniScale;
            miniCanvas.height = roomW * miniScale;
            drawGrid(miniCanvas, current.cells, miniScale, spacerFt, false, current.tileL, current.tileW, getPrimaryOpeningRects(roomW));
            subCaption.textContent = `${current.cutTiles} cuts · smallest edge ${(current.minSliver * 12).toFixed(1)}"`;
            subCaption.style.color = current.sliverRatio < 0.33 ? '#b91c1c' : '#64748b';
        };
        paintCard();

        // A square tile looks identical after a 90° turn, so the button would
        // be a no-op - don't offer it.
        if (!isSquare) {
            const rotateBtn = document.createElement('button');
            rotateBtn.type = 'button';
            rotateBtn.className = 'btn-ghost';
            rotateBtn.textContent = t.cardRotateBtn;
            rotateBtn.title = t.cardRotateTitle;
            rotateBtn.style.cssText = 'width:auto; margin:8px 0 0; padding:6px 10px; font-size:12px;';
            rotateBtn.onclick = () => {
                current = evaluateLayout(current.key, current.baseLabel, current.tileW, current.tileL);
                paintCard();
            };
            card.appendChild(rotateBtn);
        }

        gridsContainer.appendChild(card);
    }

    const section = document.getElementById('compareSection');
    section.style.display = 'block';
    section.dataset.open = '1';
}

function compareWastage() {
    const t = I18N[currentLang];
    const inputs = readInputsOrShowError(t);
    if (!inputs) return;
    const { roomL, roomW, tileL, tileW, spacerFt, piecesPerBox, handlingPct, ratePerBox } = inputs;
    const layoutType = document.getElementById('layoutType').value;

    const { fullTiles, cutTiles } = simulateGrid(layoutType, roomL, roomW, tileL, tileW, spacerFt, getPrimaryOpeningRects(roomW));

    // Sensitivity range, always including the user's current value so they can
    // see exactly where "their number" sits relative to the alternatives.
    const levels = [0, 2, 3, 5, 8, 10, 15];
    if (!levels.includes(Math.round(handlingPct))) levels.push(Math.round(handlingPct));
    levels.sort((a, b) => a - b);

    const showCost = ratePerBox > 0;
    let html = `<thead><tr style="background:#f1f5f9; text-align:left;">
        <th style="padding:8px; border-bottom:2px solid #cbd5e1;">${t.col_handling}</th>
        <th style="padding:8px; border-bottom:2px solid #cbd5e1;">${t.col_pieces}</th>
        <th style="padding:8px; border-bottom:2px solid #cbd5e1;">${t.col_boxes}</th>
        ${showCost ? `<th style="padding:8px; border-bottom:2px solid #cbd5e1;">${t.col_cost}</th>` : ''}
        <th style="padding:8px; border-bottom:2px solid #cbd5e1;"></th>
    </tr></thead><tbody>`;

    for (const pct of levels) {
        const order = computeOrder(fullTiles, cutTiles, tileL, tileW, roomL, roomW, piecesPerBox, pct, ratePerBox, roomL * roomW - getOpeningsArea());
        const isCurrent = Math.round(pct) === Math.round(handlingPct);
        html += `<tr style="${isCurrent ? 'background:#ede9fe; font-weight:700;' : ''}">
            <td style="padding:8px; border-bottom:1px solid #e2e8f0;">${pct}%</td>
            <td style="padding:8px; border-bottom:1px solid #e2e8f0;">${order.piecesWithBuffer}</td>
            <td style="padding:8px; border-bottom:1px solid #e2e8f0;">${order.boxesNeeded}</td>
            ${showCost ? `<td style="padding:8px; border-bottom:1px solid #e2e8f0;">₹${order.estimatedCost.toLocaleString('en-IN')}</td>` : ''}
            <td style="padding:8px; border-bottom:1px solid #e2e8f0; color:#7c3aed; font-weight:700;">${isCurrent ? t.col_current : ''}</td>
        </tr>`;
    }
    html += '</tbody>';

    document.getElementById('wasteCompareTable').innerHTML = html;
    const section = document.getElementById('wasteCompareSection');
    section.style.display = 'block';
    section.dataset.open = '1';
}

window.onload = () => {
    populateTilePresets();
    syncActiveRoomInputs();
    applyTilePreset(); // sets tile dims + pcs/box from the default preset
    setLang('en');
};
</script>
